[project]
name = "vidap-foundation"
version = "0.0.0"
description = "Local foundation dependencies for ViDAP."
requires-python = ">=3.14,<3.15"
dependencies = [
  "fastapi==0.141.1",
  "uvicorn==0.53.0",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "anyio==4.15.1",
    "coverage==7.16.1",
    "httpx==0.28.1",
    "mypy==2.3.1",
    "pip-audit==2.10.1",
    "pip-licenses==5.5.5",
    "pytest==9.1.1",
    "ruff==0.16.8",
]

[tool.ruff]
target-version = "py314"
src = ["src"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "S", "BLE"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]

[tool.mypy]
python_version = "3.14"
files = ["src"]
strict = true
explicit_package_bases = true
warn_return_any = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unused_configs = true
no_implicit_optional = true

[tool.pytest.ini_options]
addopts = "--strict-markers"
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
    "unit: deterministic isolated unit coverage.",
    "integration: in-process ASGI transport coverage.",
    "smoke: reserved for future cross-process smoke coverage.",
    "slow: reserved for deliberately slow coverage.",
]

[tool.coverage.run]
branch = true
relative_files = true
source = ["src"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
]
