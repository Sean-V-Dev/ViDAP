name: ViDAP CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "0 9 * * 1"

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('{0}-pr-{1}', github.workflow, github.event.pull_request.number) || format('{0}-{1}', github.workflow, github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality-windows:
    runs-on: windows-latest
    env:
      NPM_CONFIG_CACHE: ${{ runner.temp }}\vidap-npm-cache
      UV_CACHE_DIR: ${{ runner.temp }}\vidap-uv-cache
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          package-manager-cache: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.16"
          enable-cache: false
      - name: Restore npm download cache
        if: github.event_name != 'schedule'
        uses: actions/cache@a7833574556fa59680c1b7cb190c1735db73ebf0 # v5.0.0
        with:
          path: ${{ env.NPM_CONFIG_CACHE }}
          key: npm-${{ runner.os }}-${{ runner.arch }}-node24-npm11-uv0.12.16-${{ hashFiles('package-lock.json', 'python/pyproject.toml', 'python/uv.lock') }}
      - name: Restore uv package cache
        if: github.event_name != 'schedule'
        uses: actions/cache@a7833574556fa59680c1b7cb190c1735db73ebf0 # v5.0.0
        with:
          path: ${{ env.UV_CACHE_DIR }}
          key: uv-${{ runner.os }}-${{ runner.arch }}-node24-npm11-uv0.12.16-${{ hashFiles('package-lock.json', 'python/pyproject.toml', 'python/uv.lock') }}
      - name: Locked setup
        shell: pwsh
        run: npm.cmd run setup
      - name: Quality checks
        shell: pwsh
        run: npm.cmd run check
      - name: Coverage reports
        shell: pwsh
        run: npm.cmd run coverage

  dependency-license-windows:
    runs-on: windows-latest
    env:
      NPM_CONFIG_CACHE: ${{ runner.temp }}\vidap-npm-cache
      UV_CACHE_DIR: ${{ runner.temp }}\vidap-uv-cache
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          package-manager-cache: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.16"
          enable-cache: false
      - name: Restore npm download cache
        if: github.event_name != 'schedule'
        uses: actions/cache@a7833574556fa59680c1b7cb190c1735db73ebf0 # v5.0.0
        with:
          path: ${{ env.NPM_CONFIG_CACHE }}
          key: npm-${{ runner.os }}-${{ runner.arch }}-node24-npm11-uv0.12.16-${{ hashFiles('package-lock.json', 'python/pyproject.toml', 'python/uv.lock') }}
      - name: Restore uv package cache
        if: github.event_name != 'schedule'
        uses: actions/cache@a7833574556fa59680c1b7cb190c1735db73ebf0 # v5.0.0
        with:
          path: ${{ env.UV_CACHE_DIR }}
          key: uv-${{ runner.os }}-${{ runner.arch }}-node24-npm11-uv0.12.16-${{ hashFiles('package-lock.json', 'python/pyproject.toml', 'python/uv.lock') }}
      - name: Locked setup
        shell: pwsh
        run: npm.cmd run setup
      - name: Locked dependency inventory
        shell: pwsh
        run: npm.cmd run deps:inventory
      - name: Locked license policy
        shell: pwsh
        run: npm.cmd run license:check
      - name: Locked advisory evidence
        if: always()
        shell: pwsh
        run: npm.cmd run deps:audit
      - name: Upload Python audit evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pip-audit-json
          path: ${{ runner.temp }}\vidap-pip-audit\pip-audit.json
          if-no-files-found: ignore
          retention-days: 14
      - name: Remove Python audit temporary files
        if: always()
        shell: pwsh
        run: |
          $runnerTemp = [System.IO.Path]::GetFullPath($env:RUNNER_TEMP)
          $auditDir = Join-Path $runnerTemp "vidap-pip-audit"
          if (-not $auditDir.StartsWith($runnerTemp, [System.StringComparison]::OrdinalIgnoreCase) -or
              [System.IO.Path]::GetFileName($auditDir) -ne "vidap-pip-audit") {
            throw "Refusing to clean a path outside the fixed RUNNER_TEMP audit directory."
          }
          if (Test-Path -LiteralPath $auditDir) {
            $item = Get-Item -LiteralPath $auditDir -Force
            if (-not $item.PSIsContainer -or ($item.Attributes -band [System.IO.FileAttributes]::ReparsePoint)) {
              throw "Refusing to recursively delete a non-directory or reparse point."
            }
            Remove-Item -LiteralPath $auditDir -Recurse -Force -ErrorAction Stop
          }
